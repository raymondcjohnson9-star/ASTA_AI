name: ASTA_AI - Train and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Train logic brain
        run: python brain/trainer.py

      - name: Train text brain
        run: python brain/text_trainer.py

      - name: Save trained models as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: asta-ai-trained-model
          path: models/*.json
          if-no-files-found: error
